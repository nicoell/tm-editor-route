[git]
repo_url = "https://github.com/nicoell/tm-editor-route.git"

[archive]
zip_name = "EditorRoute.op"
whitelist = ["src", "info.toml", "LICENSE", "Readme.md"]

[mcpp]
# Relative to the builder executable. PluginBuilder bundles this runtime itself.
executable_path = "tools/mcpp/bin/mcpp.exe"

[debug]
dev_plugin_name = "EditorRouteDev"

[preprocessor]
debug_macro = "DEBUG=1"
release_macro = "RELEASE=1"
define_to_replace = "ER_DEBUG"
replacement_define = "ER_SHIPPING"
